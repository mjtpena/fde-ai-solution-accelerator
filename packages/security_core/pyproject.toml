[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fde-security-core"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = []

[tool.setuptools]
packages = [
    "accelerator.security_core",
    "accelerator.security_core.authorisation",
    "accelerator.security_core.tool_policy",
    "accelerator.security_core.cost_guard",
    "accelerator.security_core.prompt_injection",
    "accelerator.security_core.data_boundaries",
    "accelerator.security_core.redaction",
]
package-dir = {"accelerator.security_core" = "."}

[tool.setuptools.package-data]
"accelerator.security_core" = ["py.typed"]
