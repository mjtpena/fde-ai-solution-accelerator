[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fde-security-core"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "pydantic>=2.7,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.30,<1",
]

[dependency-groups]
dev = ["aiosqlite>=0.21,<1"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["accelerator.security_core*"]

[tool.setuptools.package-data]
"accelerator.security_core" = ["py.typed"]
