[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fde-evaluation-core"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "azure-ai-evaluation>=1,<2",
    "azure-identity>=1,<2",
    "fde-agent-core>=0.1,<1",
    "fde-security-core>=0.1,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.7,<3",
    "PyYAML>=6,<7",
]

[tool.uv.sources]
fde-agent-core = { workspace = true }
fde-security-core = { workspace = true }

[tool.setuptools]
packages = [
    "accelerator.evaluation_core",
    "accelerator.evaluation_core.datasets",
    "accelerator.evaluation_core.evaluators",
    "accelerator.evaluation_core.runners",
    "accelerator.evaluation_core.baselines",
    "accelerator.evaluation_core.reporting",
]
package-dir = {"accelerator.evaluation_core" = "."}

[tool.setuptools.package-data]
"accelerator.evaluation_core" = ["py.typed"]
