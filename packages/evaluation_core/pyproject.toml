[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fde-evaluation-core"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = []

[tool.setuptools]
packages = [
    "accelerator.evaluation_core",
    "accelerator.evaluation_core.datasets",
    "accelerator.evaluation_core.evaluators",
    "accelerator.evaluation_core.runners",
    "accelerator.evaluation_core.baselines",
    "accelerator.evaluation_core.reporting",
]
package-dir = {"accelerator.evaluation_core" = "."}
