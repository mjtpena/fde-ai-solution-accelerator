repos:
  - repo: local
    hooks:
      - id: ruff
        name: Ruff lint
        entry: uv run --all-packages ruff check
        language: system
        types: [python]
      - id: mypy
        name: mypy strict
        entry: uv run --all-packages mypy --strict
        language: system
        pass_filenames: false
      - id: mypy-tests
        name: mypy strict test modules outside packages
        entry: uv run --all-packages mypy --strict workers/ingestion/tests apps/api/tests/test_scope_resolver.py
        language: system
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: uv run --all-packages pytest
        language: system
        pass_filenames: false
      - id: eslint
        name: ESLint
        entry: npm --workspace apps/web run lint --
        language: system
        types_or: [javascript, jsx, ts, tsx]
        pass_filenames: false
      - id: prettier
        name: Prettier
        entry: npm --workspace apps/web run format:check --
        language: system
        pass_filenames: false
      - id: vitest
        name: Vitest
        entry: npm --workspace apps/web run test --
        language: system
        types_or: [javascript, jsx, ts, tsx]
        pass_filenames: false
  # Secret scanning before a commit exists. Pinned to the v8.28.0 commit.
  - repo: https://github.com/gitleaks/gitleaks
    rev: 39fdb480a06768cc41a84ef86959c07ff33091c4 # v8.28.0
    hooks:
      - id: gitleaks
