      - workers/ingestion/tests/test_database.py

  - id: C-022
    title: Least-privilege RBAC per managed identity
    description: >-
      Each container app has its own user-assigned identity. Each role assignment is
      scoped to a single resource: AcrPull on the registry, Search reader or index
      contributor, one blob container, one queue, Foundry User at project
      scope, Cognitive Services User on the Content Safety account, and Monitoring
      Metrics Publisher on Application Insights. The API has no Storage access.
    type: preventive
    status: implemented
    implemented_in:
