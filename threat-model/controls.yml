  - id: C-021
    title: Verified TLS and Entra-only auth to PostgreSQL on a private network
    description: >-
      The API, migrations and worker connect with a TLS context that requires a
      verified certificate and hostname, and send the Entra access token only over
      that channel. The server has password auth disabled and public network access
      disabled.
    type: preventive
    status: implemented
    notes: >-
      Server-side require_secure_transport is not pinned in Bicep. It relies on the
      Azure Flexible Server default (on). The client-side checks are enforced and
      tested.
    implemented_in:
      - apps/api/src/accelerator/infrastructure/database.py
      - apps/api/src/accelerator/migrations/env.py
      - workers/ingestion/src/ingestion_worker/infrastructure/database.py
      - infrastructure/modules/postgres.bicep
    verified_by:
