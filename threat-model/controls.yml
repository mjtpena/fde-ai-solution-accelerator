  - id: C-023
    title: Dependency, code and image vulnerability scanning
    description: >-
      CodeQL (extended suite) covers Python, TypeScript and Actions. Trivy fails on
      HIGH or CRITICAL findings in the repository and in every runtime image.
      Dependency review blocks newly introduced vulnerable dependencies. Dependabot
      updates the uv and npm workspaces, Actions and Dockerfiles weekly, and lockfiles
      are committed.
    type: detective
    status: partial
    notes: >-
      Per .github/SECURITY_SCANNING.md, no repository ruleset or branch protection
      makes these checks required yet, so a failing scan does not block a manual
      merge.
    implemented_in:
      - .github/workflows/security.yml
      - .github/dependabot.yml
      - uv.lock
      - package-lock.json
    verified_by:
      - .github/tests/test_security_configuration.py
      - .github/workflows/security.yml

  - id: C-024
    title: Pinned build inputs and keyless deployment
    description: >-
      Workflow actions are pinned to full commit SHAs. Deployment uses GitHub OIDC
      (azure/login) with no stored cloud credentials. Applications deploy by
      immutable image digest. CODEOWNERS review is configured.
    type: preventive
    status: partial
    notes: >-
      The api, ingestion and hosted_agent Dockerfiles pin base images by digest.
      The web Dockerfile uses a tag only (node:22-alpine).
    implemented_in:
