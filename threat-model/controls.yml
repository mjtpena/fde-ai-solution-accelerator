      - infrastructure/modules/storage-queue-role-assignment.bicep
      - infrastructure/modules/foundry-user-role-assignment.bicep
      - infrastructure/modules/content-safety-user-role-assignment.bicep
      - infrastructure/modules/monitoring-publisher-role-assignment.bicep
    verified_by:
