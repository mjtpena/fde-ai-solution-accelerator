      - apps/api/src/accelerator/api/audit.py
    verified_by:
      - apps/api/tests/test_postgres_audit.py
      - apps/api/tests/test_audit.py

  - id: C-020
    title: Least-privilege database grants for runtime roles
    description: >-
      Migrations grant each runtime role only the privileges its code uses. Runtime
      roles cannot change the schema, and audit tables never get UPDATE or DELETE.
    type: preventive
    status: implemented
    implemented_in:
      - apps/api/src/accelerator/migrations/grants.py
      - infrastructure/scripts/grant-postgres-schema.sql
    verified_by:
