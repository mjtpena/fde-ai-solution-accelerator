  - id: C-028
    title: End-to-end correlation IDs and audited authentication failures
    description: >-
      Every request gets a validated UUID correlation ID. It appears on the response,
      on all spans, on structured logs, in audit events and in approval records.
      Authentication and authorization failures are audited, with throttling, and
      without request secrets.
    type: detective
    status: implemented
    implemented_in:
