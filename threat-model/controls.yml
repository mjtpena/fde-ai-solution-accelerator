  - id: C-025
    title: Ingestion content-type allow-list, size limit and poison handling
    description: >-
      Ingestion messages must declare text/plain, text/markdown or application/pdf.
      Documents above max_document_bytes (25 MiB by default) or that fail parsing
      are rejected permanently and moved to a poison queue. Parsing runs in the
      separate ingestion worker container, not in the API.
    type: preventive
    status: partial
    notes: >-
      Parser isolation is only process and container separation. Parsers have no
      dedicated sandbox and no per-document CPU or memory limits.
    implemented_in:
      - workers/ingestion/src/ingestion_worker/pipeline.py
      - workers/ingestion/src/ingestion_worker/handler.py
      - workers/ingestion/src/ingestion_worker/consumer.py
      - workers/ingestion/src/ingestion_worker/settings.py
      - packages/retrieval_core/parsing/pdf.py
    verified_by:
      - workers/ingestion/tests/test_pipeline.py
      - workers/ingestion/tests/test_consumer.py
      - tests/test_ingestion_worker.py

  - id: C-026
    title: Explicit tool allow-list and network egress restriction
    description: >-
      Agents can call only tools registered in ToolRegistry, with typed argument
      models and audited names. Duplicate or unknown tools fail. Outbound network
      access from tool code should also be restricted to approved destinations.
    type: preventive
    status: partial
    notes: >-
      The registry allow-list is implemented. Network egress restriction for tool
