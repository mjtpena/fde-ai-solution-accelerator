version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directories:
      - /apps/api
      - /apps/web
      - /workers/ingestion
      # BEGIN ACCELERATOR ONLY
      - /infrastructure/hosted_agent
      # END ACCELERATOR ONLY
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
