name: Deploy dev

# Configure GitHub's `dev` environment with AZURE_CLIENT_ID,
# AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID, and AZURE_LOCATION variables.
# Add Entra federated credentials for
# repo:mjtpena/fde-ai-solution-accelerator:environment:dev and audience
# api://AzureADTokenExchange. Do not store Azure credentials as GitHub secrets.
# Grant the OIDC principal least-privilege subscription deployment and ACR push
# rights; app UAMIs receive registry pull rights from the Bicep deployment.
# Configure the `production` environment with required reviewers before opting
# into its promotion job, and federate
# repo:mjtpena/fde-ai-solution-accelerator:environment:production.
# Production resources are pre-provisioned separately. All images (api, web,
# worker, hosted agent) are built from this repository and deployed by digest.
# Bicep owns all dev apps; DEPLOY_APPLICATIONS selects bootstrap/app deployment.
# Also configure WEB_ENTRA_CLIENT_ID and WEB_ENTRA_API_SCOPE (compiled into the web
# bundle; not secrets) and, optionally, AZURE_DEPLOYMENT_PRINCIPAL_ID (this OIDC
# principal's object ID, granted Search Service Contributor to create the index).
# The full evaluation runs on the VNet runner (dev-database environment, which
# also needs EVALUATION_PRINCIPAL_OBJECT_ID and the EVALUATION_JUDGE_* variables);
# set AZURE_EVALUATION_PRINCIPAL_ID in dev to that runner identity's object ID.
# Every stage after the infrastructure deployment is
# infrastructure/scripts/deploy-dev.sh, the same script `make deploy-dev` runs.
# The protected `dev-database` environment needs DB-admin OIDC variables,
# AZURE_POSTGRES_ADMIN_NAME and POSTGRES_CA_CERTIFICATE_PATH. Use an ephemeral
# Linux runner labelled by repository-level POSTGRES_RUNNER_LABEL with Azure CLI,
# pwsh, psql, trusted PEM, and federation scoped to
# repo:mjtpena/fde-ai-solution-accelerator:environment:dev-database.
# VNet routing and private DNS. Bootstrap roles separately before verification.
# Also configure HOSTED_AGENT_NAME, HOSTED_APPLICATION_FACTORY (a trusted
# module:callable), and the three EVALUATION_* variables in `dev`; set the
# three AZURE_POSTGRES_ADMIN_* variables in `dev`, and the production Foundry
# endpoint/deployment, resource group, and target app names in `production`.
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_production:
        description: Promote the tested images to pre-provisioned production resources
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: deploy-dev-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Quality and smoke evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            **/pyproject.toml

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: |
          uv sync --all-packages --frozen
          npm ci

      - name: Check
        run: make check SKIP_GENERATOR=1

      - name: Validate Bicep without credentials
        shell: pwsh
        run: |
          ./infrastructure/tests/validate-infrastructure.ps1
          ./infrastructure/scripts/validate-deployment.ps1 -BuildOnly

      - name: Smoke evaluation
        run: make eval-smoke

      - name: Upload smoke evaluation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: smoke-evaluation-${{ github.sha }}
          path: |
            evaluations/reports/smoke.json
            evaluations/reports/smoke.md
          if-no-files-found: warn
          retention-days: 30

  deploy_dev:
    name: Deploy dev resources and applications
    needs: quality
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: dev
    permissions:
      contents: read
      id-token: write
    outputs:
      resource_group_name: ${{ steps.outputs.outputs.resource_group_name }}
      registry_name: ${{ steps.outputs.outputs.registry_name }}
      registry_login_server: ${{ steps.outputs.outputs.registry_login_server }}
      container_apps_environment_name: ${{ steps.outputs.outputs.container_apps_environment_name }}
      registry_id: ${{ steps.outputs.outputs.registry_id }}
      container_apps_environment_id: ${{ steps.outputs.outputs.container_apps_environment_id }}
      api_container_app_name: ${{ steps.outputs.outputs.api_container_app_name }}
      web_container_app_name: ${{ steps.outputs.outputs.web_container_app_name }}
      worker_container_app_name: ${{ steps.outputs.outputs.worker_container_app_name }}
      api_identity_id: ${{ steps.outputs.outputs.api_identity_id }}
      api_identity_principal_id: ${{ steps.outputs.outputs.api_identity_principal_id }}
      search_endpoint: ${{ steps.outputs.outputs.search_endpoint }}
      search_index_name: ${{ steps.outputs.outputs.search_index_name }}
      search_vector_dimensions: ${{ steps.outputs.outputs.search_vector_dimensions }}
      embedding_deployment_name: ${{ steps.outputs.outputs.embedding_deployment_name }}
      web_identity_id: ${{ steps.outputs.outputs.web_identity_id }}
      web_identity_principal_id: ${{ steps.outputs.outputs.web_identity_principal_id }}
      worker_identity_id: ${{ steps.outputs.outputs.worker_identity_id }}
      worker_identity_principal_id: ${{ steps.outputs.outputs.worker_identity_principal_id }}
      migrator_identity_principal_id: ${{ steps.outputs.outputs.migrator_identity_principal_id }}
      project_endpoint: ${{ steps.outputs.outputs.project_endpoint }}
      foundry_project_id: ${{ steps.outputs.outputs.foundry_project_id }}
      foundry_project_name: ${{ steps.outputs.outputs.foundry_project_name }}
      model_deployment_name: ${{ steps.outputs.outputs.model_deployment_name }}
      api_image: ${{ steps.images.outputs.api_image }}
      web_image: ${{ steps.images.outputs.web_image }}
      worker_image: ${{ steps.images.outputs.worker_image }}
      agent_image: ${{ steps.images.outputs.agent_image }}
      postgres_fqdn: ${{ steps.outputs.outputs.postgres_fqdn }}
      postgres_database_name: ${{ steps.outputs.outputs.postgres_database_name }}
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      HOSTED_AGENT_NAME: ${{ vars.HOSTED_AGENT_NAME }}
      HOSTED_APPLICATION_FACTORY: ${{ vars.HOSTED_APPLICATION_FACTORY }}
      AZURE_POSTGRES_ADMIN_OBJECT_ID: ${{ vars.AZURE_POSTGRES_ADMIN_OBJECT_ID }}
      AZURE_POSTGRES_ADMIN_NAME: ${{ vars.AZURE_POSTGRES_ADMIN_NAME }}
      AZURE_POSTGRES_ADMIN_PRINCIPAL_TYPE: ${{ vars.AZURE_POSTGRES_ADMIN_PRINCIPAL_TYPE }}
      EVALUATION_JUDGE_AZURE_ENDPOINT: ${{ vars.EVALUATION_JUDGE_AZURE_ENDPOINT }}
      EVALUATION_JUDGE_AZURE_DEPLOYMENT: ${{ vars.EVALUATION_JUDGE_AZURE_DEPLOYMENT }}
      EVALUATION_DATASET: ${{ vars.EVALUATION_DATASET }}
      DEPLOY_APPLICATIONS: "false"
      API_ENTRA_TENANT_ID: ${{ vars.API_ENTRA_TENANT_ID }}
      API_ENTRA_AUDIENCE: ${{ vars.API_ENTRA_AUDIENCE }}
      WEB_ENTRA_CLIENT_ID: ${{ vars.WEB_ENTRA_CLIENT_ID }}
      WEB_ENTRA_API_SCOPE: ${{ vars.WEB_ENTRA_API_SCOPE }}
      AZURE_DEPLOYMENT_PRINCIPAL_ID: ${{ vars.AZURE_DEPLOYMENT_PRINCIPAL_ID }}
      AZURE_EVALUATION_PRINCIPAL_ID: ${{ vars.AZURE_EVALUATION_PRINCIPAL_ID }}
      POSTGRES_RUNNER_LABEL: ${{ vars.POSTGRES_RUNNER_LABEL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            **/pyproject.toml

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            AZURE_SUBSCRIPTION_ID \
            AZURE_LOCATION \
            AZURE_POSTGRES_ADMIN_OBJECT_ID \
            AZURE_POSTGRES_ADMIN_NAME \
            AZURE_POSTGRES_ADMIN_PRINCIPAL_TYPE \
            API_ENTRA_TENANT_ID \
            API_ENTRA_AUDIENCE \
            WEB_ENTRA_CLIENT_ID \
            WEB_ENTRA_API_SCOPE \
            POSTGRES_RUNNER_LABEL \
            HOSTED_AGENT_NAME \
            HOSTED_APPLICATION_FACTORY \
            EVALUATION_JUDGE_AZURE_ENDPOINT \
            EVALUATION_JUDGE_AZURE_DEPLOYMENT; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Configure the $name variable in the dev environment."
              exit 1
            fi
          done

      - name: Sign in to Azure with OIDC
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Validate Bicep deployment with what-if
        id: what_if
        shell: pwsh
        run: |
          ./infrastructure/scripts/validate-deployment.ps1 `
            -SubscriptionId "$env:AZURE_SUBSCRIPTION_ID" `
            -Location "$env:AZURE_LOCATION" `
            -ParameterFile "infrastructure/parameters/dev.example.bicepparam" `
            -WhatIfOutputPath (Join-Path $env:RUNNER_TEMP "deployment-what-if.json")

      - name: Upload successful what-if evidence
        if: steps.what_if.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dev-bootstrap-what-if-${{ github.sha }}
          path: ${{ runner.temp }}/deployment-what-if.json
          if-no-files-found: error
          retention-days: 30

      - name: Deploy dev infrastructure
        id: infrastructure
        shell: bash
        run: |
          set -euo pipefail
          deployment_name="fde-dev-$GITHUB_SHA"
          az deployment sub create \
            --subscription "$AZURE_SUBSCRIPTION_ID" \
            --name "$deployment_name" \
            --location "$AZURE_LOCATION" \
            --template-file infrastructure/main.bicep \
            --parameters infrastructure/parameters/dev.example.bicepparam \
            --output none
          echo "name=$deployment_name" >> "$GITHUB_OUTPUT"

      - name: Read deployment outputs
        id: outputs
        shell: bash
        env:
          DEPLOYMENT_NAME: ${{ steps.infrastructure.outputs.name }}
        run: |
          set -euo pipefail
          outputs="$(az deployment sub show \
            --subscription "$AZURE_SUBSCRIPTION_ID" \
            --name "$DEPLOYMENT_NAME" \
            --query properties.outputs \
            --output json)"
          {
            echo "resource_group_name=$(jq -er '.resourceGroupName.value' <<< "$outputs")"
            echo "registry_name=$(jq -er '.registryName.value' <<< "$outputs")"
            echo "registry_login_server=$(jq -er '.registryLoginServer.value' <<< "$outputs")"
            echo "registry_id=$(jq -er '.registryId.value' <<< "$outputs")"
            echo "container_apps_environment_name=$(jq -er '.containerAppsEnvironmentName.value' <<< "$outputs")"
            echo "container_apps_environment_id=$(jq -er '.containerAppsEnvironmentId.value' <<< "$outputs")"
            echo "api_container_app_name=$(jq -er '.containerAppNames.value.api' <<< "$outputs")"
            echo "web_container_app_name=$(jq -er '.containerAppNames.value.web' <<< "$outputs")"
            echo "worker_container_app_name=$(jq -er '.containerAppNames.value.worker' <<< "$outputs")"
            echo "api_identity_id=$(jq -er '.apiIdentityId.value' <<< "$outputs")"
            echo "api_identity_principal_id=$(jq -er '.apiIdentityPrincipalId.value' <<< "$outputs")"
            echo "web_identity_id=$(jq -er '.webIdentityId.value' <<< "$outputs")"
            echo "web_identity_principal_id=$(jq -er '.webIdentityPrincipalId.value' <<< "$outputs")"
            echo "worker_identity_id=$(jq -er '.workerIdentityId.value' <<< "$outputs")"
            echo "worker_identity_principal_id=$(jq -er '.workerIdentityPrincipalId.value' <<< "$outputs")"
            echo "migrator_identity_principal_id=$(jq -er '.migratorIdentityPrincipalId.value' <<< "$outputs")"
            echo "project_endpoint=$(jq -er '.projectEndpoint.value' <<< "$outputs")"
            echo "foundry_project_id=$(jq -er '.foundryProjectId.value' <<< "$outputs")"
            echo "foundry_project_name=$(jq -er '.foundryProjectName.value' <<< "$outputs")"
            echo "model_deployment_name=$(jq -er '.modelDeploymentName.value' <<< "$outputs")"
            echo "postgres_fqdn=$(jq -er '.postgresFqdn.value' <<< "$outputs")"
            echo "postgres_database_name=$(jq -er '.postgresDatabaseName.value' <<< "$outputs")"
            echo "search_endpoint=$(jq -er '.searchEndpoint.value' <<< "$outputs")"
            echo "search_index_name=$(jq -er '.searchIndexName.value' <<< "$outputs")"
            echo "search_vector_dimensions=$(jq -er '.searchVectorDimensions.value' <<< "$outputs")"
            echo "embedding_deployment_name=$(jq -er '.embeddingDeploymentName.value' <<< "$outputs")"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push application images
        id: images
        shell: bash
        env:
          REGISTRY_NAME: ${{ steps.outputs.outputs.registry_name }}
          REGISTRY_LOGIN_SERVER: ${{ steps.outputs.outputs.registry_login_server }}
        run: |
          set -euo pipefail
          tag="$GITHUB_SHA"
          api_image="$REGISTRY_LOGIN_SERVER/api:$tag"
          web_image="$REGISTRY_LOGIN_SERVER/web:$tag"
          worker_image="$REGISTRY_LOGIN_SERVER/worker:$tag"
          agent_image="$REGISTRY_LOGIN_SERVER/fde-agent:$tag"

          az acr login --name "$REGISTRY_NAME"
          docker buildx build --platform linux/amd64 \
            --file apps/api/Dockerfile \
            --tag "$api_image" \
            --metadata-file "$RUNNER_TEMP/api-image.json" \
            --push .
          # NEXT_PUBLIC_* values are compiled into the browser bundle; not secrets.
          docker buildx build --platform linux/amd64 \
            --file apps/web/Dockerfile \
            --build-arg "NEXT_PUBLIC_ENTRA_TENANT_ID=$API_ENTRA_TENANT_ID" \
            --build-arg "NEXT_PUBLIC_ENTRA_CLIENT_ID=$WEB_ENTRA_CLIENT_ID" \
            --build-arg "NEXT_PUBLIC_ENTRA_API_SCOPE=$WEB_ENTRA_API_SCOPE" \
            --tag "$web_image" \
            --metadata-file "$RUNNER_TEMP/web-image.json" \
            --push .
          docker buildx build --platform linux/amd64 \
            --file workers/ingestion/Dockerfile \
            --tag "$worker_image" \
            --metadata-file "$RUNNER_TEMP/worker-image.json" \
            --push .
          docker buildx build --platform linux/amd64 \
            --file infrastructure/hosted_agent/Dockerfile \
            --tag "$agent_image" \
            --metadata-file "$RUNNER_TEMP/agent-image.json" \
            --push .

          {
            echo "api_image=$REGISTRY_LOGIN_SERVER/api@$(jq -er '.["containerimage.digest"]' "$RUNNER_TEMP/api-image.json")"
            echo "web_image=$REGISTRY_LOGIN_SERVER/web@$(jq -er '.["containerimage.digest"]' "$RUNNER_TEMP/web-image.json")"
            echo "worker_image=$REGISTRY_LOGIN_SERVER/worker@$(jq -er '.["containerimage.digest"]' "$RUNNER_TEMP/worker-image.json")"
            echo "agent_image=$REGISTRY_LOGIN_SERVER/fde-agent@$(jq -er '.["containerimage.digest"]' "$RUNNER_TEMP/agent-image.json")"
          } >> "$GITHUB_OUTPUT"

      - name: Smoke test deployed Azure infrastructure
        shell: bash
        env:
          DEPLOYMENT_NAME: ${{ steps.infrastructure.outputs.name }}
          REGISTRY_ID: ${{ steps.outputs.outputs.registry_id }}
          ENVIRONMENT_ID: ${{ steps.outputs.outputs.container_apps_environment_id }}
          FOUNDRY_PROJECT_ID: ${{ steps.outputs.outputs.foundry_project_id }}
        run: |
          set -euo pipefail
          deployment_state="$(az deployment sub show \
            --subscription "$AZURE_SUBSCRIPTION_ID" \
            --name "$DEPLOYMENT_NAME" \
            --query properties.provisioningState \
            --output tsv)"
          registry_state="$(az resource show \
            --ids "$REGISTRY_ID" \
            --query properties.provisioningState \
            --output tsv)"
          environment_state="$(az resource show \
            --ids "$ENVIRONMENT_ID" \
            --query properties.provisioningState \
            --output tsv)"
          project_state="$(az resource show \
            --ids "$FOUNDRY_PROJECT_ID" \
            --query properties.provisioningState \
            --output tsv)"
          if [[ "$deployment_state" != "Succeeded" ]]; then
            echo "::error::Subscription deployment state was '$deployment_state'."
            exit 1
          fi
          if [[ "$registry_state" != "Succeeded" ]]; then
            echo "::error::Container registry provisioning state was '$registry_state'."
            exit 1
          fi
          if [[ "$environment_state" != "Succeeded" ]]; then
            echo "::error::Container Apps environment provisioning state was '$environment_state'."
            exit 1
          fi
          if [[ "$project_state" != "Succeeded" ]]; then
            echo "::error::Foundry project provisioning state was '$project_state'."
            exit 1
          fi

  verify_database:
    name: Verify private PostgreSQL principals
    needs: deploy_dev
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, "${{ vars.POSTGRES_RUNNER_LABEL }}"]
    timeout-minutes: 15
    environment: dev-database
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify OID-bound database roles without modifying them
        shell: pwsh
        env:
          POSTGRES_HOST: ${{ needs.deploy_dev.outputs.postgres_fqdn }}
          POSTGRES_DATABASE: ${{ needs.deploy_dev.outputs.postgres_database_name }}
          POSTGRES_ADMIN: ${{ vars.AZURE_POSTGRES_ADMIN_NAME }}
          POSTGRES_CA: ${{ vars.POSTGRES_CA_CERTIFICATE_PATH }}
          API_PRINCIPAL: ${{ needs.deploy_dev.outputs.api_identity_principal_id }}
          WORKER_PRINCIPAL: ${{ needs.deploy_dev.outputs.worker_identity_principal_id }}
          MIGRATOR_PRINCIPAL: ${{ needs.deploy_dev.outputs.migrator_identity_principal_id }}
        run: |
          ./infrastructure/scripts/bootstrap-postgres.ps1 `
            -HostName $env:POSTGRES_HOST -DatabaseName $env:POSTGRES_DATABASE `
            -AdministratorName $env:POSTGRES_ADMIN `
            -ApiPrincipalId $env:API_PRINCIPAL -WorkerPrincipalId $env:WORKER_PRINCIPAL `
            -MigratorPrincipalId $env:MIGRATOR_PRINCIPAL `
            -CaCertificatePath $env:POSTGRES_CA -VerifyOnly

  deploy_applications:
    name: Deploy Bicep-owned applications
    needs: [deploy_dev, verify_database]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: dev
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_POSTGRES_ADMIN_OBJECT_ID: ${{ vars.AZURE_POSTGRES_ADMIN_OBJECT_ID }}
      AZURE_POSTGRES_ADMIN_NAME: ${{ vars.AZURE_POSTGRES_ADMIN_NAME }}
      AZURE_POSTGRES_ADMIN_PRINCIPAL_TYPE: ${{ vars.AZURE_POSTGRES_ADMIN_PRINCIPAL_TYPE }}
      DEPLOY_APPLICATIONS: "true"
      DEPLOYMENT_NAME: fde-dev-${{ github.sha }}
      AZURE_DEPLOYMENT_PRINCIPAL_ID: ${{ vars.AZURE_DEPLOYMENT_PRINCIPAL_ID }}
      AZURE_EVALUATION_PRINCIPAL_ID: ${{ vars.AZURE_EVALUATION_PRINCIPAL_ID }}
      API_IMAGE: ${{ needs.deploy_dev.outputs.api_image }}
      WEB_IMAGE: ${{ needs.deploy_dev.outputs.web_image }}
      WORKER_IMAGE: ${{ needs.deploy_dev.outputs.worker_image }}
      API_ENTRA_TENANT_ID: ${{ vars.API_ENTRA_TENANT_ID }}
      API_ENTRA_AUDIENCE: ${{ vars.API_ENTRA_AUDIENCE }}
      HOSTED_AGENT_NAME: ${{ vars.HOSTED_AGENT_NAME }}
      HOSTED_APPLICATION_FACTORY: ${{ vars.HOSTED_APPLICATION_FACTORY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Validate application deployment with what-if
        id: what_if
        shell: pwsh
        run: |
          ./infrastructure/scripts/validate-deployment.ps1 `
            -SubscriptionId $env:AZURE_SUBSCRIPTION_ID -Location $env:AZURE_LOCATION `
            -ParameterFile "infrastructure/parameters/dev.example.bicepparam" `
            -WhatIfOutputPath (Join-Path $env:RUNNER_TEMP "applications-what-if.json")

      - name: Upload successful application what-if evidence
        if: steps.what_if.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dev-applications-what-if-${{ github.sha }}
          path: ${{ runner.temp }}/applications-what-if.json
          if-no-files-found: error
          retention-days: 30

      - name: Deploy application resources through Bicep
        run: infrastructure/scripts/deploy-dev.sh applications

      - name: Verify application resource provisioning
        shell: bash
        env:
          RESOURCE_GROUP_NAME: ${{ needs.deploy_dev.outputs.resource_group_name }}
          API_APP_NAME: ${{ needs.deploy_dev.outputs.api_container_app_name }}
          WEB_APP_NAME: ${{ needs.deploy_dev.outputs.web_container_app_name }}
          WORKER_APP_NAME: ${{ needs.deploy_dev.outputs.worker_container_app_name }}
        run: |
          set -euo pipefail
          for app in "$API_APP_NAME" "$WEB_APP_NAME" "$WORKER_APP_NAME"; do
            state="$(az resource show --resource-group "$RESOURCE_GROUP_NAME" \
              --resource-type Microsoft.App/containerApps --name "$app" \
              --query properties.provisioningState --output tsv)"
            if [[ "$state" != "Succeeded" ]]; then
              echo "::error::Application provisioning did not succeed."
              exit 1
            fi
          done

      - name: Run schema migrations
        run: infrastructure/scripts/deploy-dev.sh migrate

      - name: Create or update the search index
        run: infrastructure/scripts/deploy-dev.sh index

      - name: Smoke test the web app and the API behind it
        run: infrastructure/scripts/deploy-dev.sh smoke

      - name: Deploy and smoke test Foundry hosted agent
        shell: bash
        env:
          HOSTED_PROJECT_ENDPOINT: ${{ needs.deploy_dev.outputs.project_endpoint }}
          HOSTED_MODEL_DEPLOYMENT: ${{ needs.deploy_dev.outputs.model_deployment_name }}
          HOSTED_IMAGE: ${{ needs.deploy_dev.outputs.agent_image }}
          HOSTED_CREDENTIAL_MODE: azure-cli
        run: |
          set -euo pipefail
          : "${HOSTED_APPLICATION_FACTORY:?Configure HOSTED_APPLICATION_FACTORY in the dev environment; refusing an untrusted fallback.}"
          uv sync --project infrastructure/hosted_agent --frozen
          uv run --project infrastructure/hosted_agent \
            python -m infrastructure.hosted_agent.cli deploy
          uv run --project infrastructure/hosted_agent \
            python -m infrastructure.hosted_agent.cli smoke

  # Scopes for the evaluation principal come from the private database, so this
  # runs on the VNet runner, signed in with the dev-database OIDC identity.
  full_evaluation:
    name: Full evaluation
    needs: [deploy_dev, deploy_applications]
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, "${{ vars.POSTGRES_RUNNER_LABEL }}"]
    timeout-minutes: 60
    environment: dev-database
    permissions:
      contents: read
      id-token: write
    env:
      API_ENVIRONMENT: development
      API_ENTRA_TENANT_ID: ${{ vars.API_ENTRA_TENANT_ID }}
      API_ENTRA_AUDIENCE: ${{ vars.API_ENTRA_AUDIENCE }}
      API_DATABASE_URL: postgresql+asyncpg://${{ vars.AZURE_POSTGRES_ADMIN_NAME }}@${{ needs.deploy_dev.outputs.postgres_fqdn }}:5432/${{ needs.deploy_dev.outputs.postgres_database_name }}
      API_DATABASE_AUTH_MODE: managed_identity
      API_DATABASE_TLS_CA_FILE: ${{ vars.POSTGRES_CA_CERTIFICATE_PATH }}
      API_FOUNDRY_PROJECT_ENDPOINT: ${{ needs.deploy_dev.outputs.project_endpoint }}
      API_FOUNDRY_MODEL_DEPLOYMENT: ${{ needs.deploy_dev.outputs.model_deployment_name }}
      API_FOUNDRY_EMBEDDING_DEPLOYMENT: ${{ needs.deploy_dev.outputs.embedding_deployment_name }}
      API_SEARCH_ENDPOINT: ${{ needs.deploy_dev.outputs.search_endpoint }}
      API_SEARCH_INDEX_NAME: ${{ needs.deploy_dev.outputs.search_index_name }}
      API_SEARCH_VECTOR_DIMENSIONS: ${{ needs.deploy_dev.outputs.search_vector_dimensions }}
      EVALUATION_PRINCIPAL_OBJECT_ID: ${{ vars.EVALUATION_PRINCIPAL_OBJECT_ID }}
      EVALUATION_JUDGE_AZURE_ENDPOINT: ${{ vars.EVALUATION_JUDGE_AZURE_ENDPOINT }}
      EVALUATION_JUDGE_AZURE_DEPLOYMENT: ${{ vars.EVALUATION_JUDGE_AZURE_DEPLOYMENT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            **/pyproject.toml

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Sign in to Azure with OIDC
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Defaults to evaluations/example-datasets/smoke.jsonl over the fixture corpus;
      # set EVALUATION_DATASET in the environment for a project dataset.
      - name: Run full evaluation
        env:
          EVALUATION_DATASET: ${{ vars.EVALUATION_DATASET || 'evaluations/example-datasets/smoke.jsonl' }}
        run: |
          uv sync --all-packages --frozen
          make eval-full

  deploy_production:
    name: Promote to production
    needs:
      - deploy_dev
      - deploy_applications
      - full_evaluation
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_production
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      RESOURCE_GROUP_NAME: ${{ vars.AZURE_RESOURCE_GROUP }}
      WEB_APP_NAME: ${{ vars.AZURE_WEB_CONTAINER_APP_NAME }}
      WORKER_APP_NAME: ${{ vars.AZURE_WORKER_CONTAINER_APP_NAME }}
      HOSTED_AGENT_NAME: ${{ vars.HOSTED_AGENT_NAME }}
      HOSTED_APPLICATION_FACTORY: ${{ vars.HOSTED_APPLICATION_FACTORY }}
      HOSTED_PROJECT_ENDPOINT: ${{ vars.HOSTED_PROJECT_ENDPOINT }}
      HOSTED_MODEL_DEPLOYMENT: ${{ vars.HOSTED_MODEL_DEPLOYMENT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            **/pyproject.toml

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Sign in to Azure with OIDC
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Validate production configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            RESOURCE_GROUP_NAME \
            WEB_APP_NAME \
            WORKER_APP_NAME \
            HOSTED_AGENT_NAME \
            HOSTED_APPLICATION_FACTORY \
            HOSTED_PROJECT_ENDPOINT \
            HOSTED_MODEL_DEPLOYMENT; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Configure the $name variable in the protected production environment."
              exit 1
            fi
          done

      - name: Deploy tested web and worker images
        shell: bash
        env:
          WEB_IMAGE: ${{ needs.deploy_dev.outputs.web_image }}
          WORKER_IMAGE: ${{ needs.deploy_dev.outputs.worker_image }}
        run: |
          set -euo pipefail
          az extension add --name containerapp --upgrade
          az containerapp update \
            --name "$WEB_APP_NAME" \
            --resource-group "$RESOURCE_GROUP_NAME" \
            --image "$WEB_IMAGE"
          az containerapp update \
            --name "$WORKER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP_NAME" \
            --image "$WORKER_IMAGE"

      - name: Deploy and smoke test Foundry hosted agent
        env:
          HOSTED_IMAGE: ${{ needs.deploy_dev.outputs.agent_image }}
          HOSTED_CREDENTIAL_MODE: azure-cli
        run: |
          set -euo pipefail
          : "${HOSTED_APPLICATION_FACTORY:?Configure HOSTED_APPLICATION_FACTORY in the protected production environment; refusing an untrusted fallback.}"
          uv sync --project infrastructure/hosted_agent --frozen
          uv run --project infrastructure/hosted_agent \
            python -m infrastructure.hosted_agent.cli deploy
          uv run --project infrastructure/hosted_agent \
            python -m infrastructure.hosted_agent.cli smoke
