name: Copilot Setup Steps

# Prepares the environment the GitHub Copilot coding agent works in.
on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/copilot-setup-steps.yml]
  pull_request:
    paths: [.github/workflows/copilot-setup-steps.yml]

jobs:
  # The job MUST be named copilot-setup-steps
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 5s --health-timeout 5s --health-retries 10
      azurite:
        image: mcr.microsoft.com/azure-storage/azurite
        ports: ["10000:10000"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        if: hashFiles('package-lock.json') != ''
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Python deps
        run: uv sync --all-packages --frozen

      - name: Install web deps
        if: hashFiles('package-lock.json') != ''
        run: npm ci

      - name: Install Bicep
        run: az bicep install

      - name: Verify toolchain
        run: |
          uv lock --check
          make check
          make eval-smoke

      - name: Verify web toolchain
        if: hashFiles('apps/web/package.json') != ''
        run: npm --prefix apps/web run --silent typecheck --if-present
