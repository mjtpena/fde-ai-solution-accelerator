name: Pull-request CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Third-party actions are pinned to full commit SHAs; the trailing comment names the
# release. Dependabot (github-actions ecosystem) proposes updates.
jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            **/pyproject.toml

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      # TLS on, because production database auth requires it and the boot test
      # exercises the production path. The key never leaves this runner.
      - name: Start PostgreSQL for database-backed tests
        run: |
          tls_dir="$RUNNER_TEMP/postgres-tls"
          mkdir -p "$tls_dir"
          openssl req -new -x509 -days 1 -nodes -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1" \
            -keyout "$tls_dir/server.key" -out "$tls_dir/server.crt"
          cp "$tls_dir/server.crt" "$RUNNER_TEMP/postgres-ca.crt"
          sudo chown 70:70 "$tls_dir/server.key" "$tls_dir/server.crt"
          sudo chmod 600 "$tls_dir/server.key"
          docker run --detach --name postgres --publish 5432:5432 \
            --env POSTGRES_PASSWORD=ci-only-password \
            --volume "$tls_dir:/tls:ro" \
            postgres:16-alpine \
            -c ssl=on -c ssl_cert_file=/tls/server.crt -c ssl_key_file=/tls/server.key
          for attempt in $(seq 1 30); do
            if docker exec postgres psql -U postgres -h 127.0.0.1 -c 'select 1' >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker logs postgres
          exit 1

      - name: Start Azurite for queue and blob tests
        run: |
          docker run --detach --name azurite --publish 10000:10000 --publish 10001:10001 \
            mcr.microsoft.com/azure-storage/azurite:3.33.0 \
            azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --skipApiVersionCheck --loose
          for attempt in $(seq 1 30); do
            if curl --silent --output /dev/null http://127.0.0.1:10001/; then exit 0; fi
            sleep 1
          done
          docker logs azurite
          exit 1

      - name: Install dependencies
        run: |
          uv sync --all-packages --frozen
          npm ci

      # Coverage is enforced by [tool.coverage.report] fail_under in pyproject.toml.
      - name: Lint, type-check and test with coverage
        env:
          TEST_POSTGRES_DSN: postgresql://postgres:ci-only-password@127.0.0.1:5432/postgres
          TEST_POSTGRES_CA_FILE: ${{ runner.temp }}/postgres-ca.crt
          # The emulator's default local endpoints; no key is stored in the repository.
          TEST_AZURITE_CONNECTION_STRING: UseDevelopmentStorage=true
        run: make check SKIP_GENERATOR=1 PYTEST_ARGS="--cov --cov-report=term --cov-report=xml"

      - name: OpenAPI contract and web client are up to date
        run: make openapi-check

      - name: Build Python packages
        run: uv build --all-packages

      - name: Build web application
        run: npm run build --workspace apps/web

      - name: Evaluation smoke check
        run: make eval-smoke

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 14

  # Generating a project runs its full `make check`; a separate job keeps it off
  # the quality job's critical path.
  generator:
    name: Generated project
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            **/pyproject.toml
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: |
          uv sync --all-packages --frozen
          npm ci
      - name: Generate a project and run its checks
        run: make check-generator

  e2e:
    name: Playwright end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      CI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx --workspace apps/web playwright install --with-deps chromium
      - name: Run end-to-end tests
        run: npm run test:e2e --workspace apps/web
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  docker:
    name: Docker build (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: apps/api/Dockerfile
          - image: web
            dockerfile: apps/web/Dockerfile
          - image: ingestion
            dockerfile: workers/ingestion/Dockerfile
          - image: hosted-agent
            dockerfile: infrastructure/hosted_agent/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Build only; images are pushed by the deployment workflow.
      - name: Build image
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
          IMAGE: ${{ matrix.image }}
        run: docker build --file "$DOCKERFILE" --tag "ci-build:$IMAGE" .
