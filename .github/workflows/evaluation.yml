name: Evaluation

on:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            **/pyproject.toml
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: uv sync --all-packages --frozen
      - name: Evaluation package tests
        run: uv run --all-packages pytest packages/evaluation_core
      # Runs the product's grounded-answer workflow and tool policy over the
      # fixture corpus and compares against evaluations/baselines/accepted.json.
      # Exits non-zero on any hard-gate failure or out-of-tolerance regression.
      - name: Smoke evaluation gate
        run: make eval-smoke
      # Belt and braces: the job also fails unless the report itself says passed.
      - name: Verify gate verdict
        shell: bash
        run: |
          python3 - <<'PY'
          import json, sys
          report = json.load(open("evaluations/reports/smoke.json", encoding="utf-8"))
          if report.get("passed") is not True or report.get("hard_failures"):
              sys.exit(f"Evaluation gate failed: hard_failures={report.get('hard_failures')}")
          PY
      - name: Job summary
        if: always()
        shell: bash
        run: |
          if [ -f evaluations/reports/smoke.md ]; then
            cat evaluations/reports/smoke.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Evaluation failed before a report could be generated. See job logs." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-report
          path: evaluations/reports/
          if-no-files-found: warn
          retention-days: 14
