name: Evaluation

on:
  pull_request:
  workflow_run:
    workflows: [Evaluation]
    types: [completed]

permissions:
  contents: read

jobs:
  smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            **/pyproject.toml
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: uv sync --all-packages --frozen
      - name: Reporting contract tests
        run: uv run --all-packages pytest packages/evaluation_core/reporting/tests
      - name: Deterministic smoke evaluation
        run: make eval-smoke
      - name: Job summary
        if: always()
        shell: bash
        run: |
          if [ -f evaluations/reports/smoke.md ]; then
            cat evaluations/reports/smoke.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Evaluation failed before a report could be generated. See job logs." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-report
          path: evaluations/reports/
          if-no-files-found: warn
          retention-days: 14

  # Runs the default-branch workflow, never PR code, with comment permission.
  # This also publishes fork PR reports without giving their evaluation a write token.
  publish:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: Identify the evaluated PR and artifact
        id: report
        uses: actions/github-script@v8
        with:
          script: |
            const run = context.payload.workflow_run;
            const {owner, repo} = context.repo;
            const candidates = await github.paginate(
              github.rest.repos.listPullRequestsAssociatedWithCommit,
              {owner, repo, commit_sha: run.head_sha}
            );
            const pr = candidates.find(p =>
              p.state === 'open' &&
              p.head.sha === run.head_sha &&
              p.head.repo?.full_name === run.head_repository.full_name
            );
            if (!pr) {
              core.notice('No open PR still matches the evaluated commit.');
              return;
            }
            core.setOutput('pr', pr.number);
            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              {owner, repo, run_id: run.id}
            );
            core.setOutput('has_artifact', artifacts.some(a =>
              a.name === 'evaluation-report' && !a.expired
            ));
      - uses: actions/download-artifact@v4
        if: steps.report.outputs.has_artifact == 'true'
        with:
          name: evaluation-report
          path: report
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Publish Markdown without executing artifact contents
        if: steps.report.outputs.pr != ''
        uses: actions/github-script@v8
        env:
          PR_NUMBER: ${{ steps.report.outputs.pr }}
          HAS_ARTIFACT: ${{ steps.report.outputs.has_artifact }}
        with:
          script: |
            const fs = require('node:fs');
            const {owner, repo} = context.repo;
            const run = context.payload.workflow_run;
            const issue_number = Number(process.env.PR_NUMBER);
            const {data: pr} = await github.rest.pulls.get({
              owner, repo, pull_number: issue_number
            });
            if (pr.state !== 'open' || pr.head.sha !== run.head_sha) {
              core.notice('PR changed while downloading the evaluation report.');
              return;
            }
            const marker = '<!-- evaluation-report -->';
            if (process.env.HAS_ARTIFACT === 'true' && fs.statSync('report/smoke.md').size > 60000) {
              throw new Error('Oversized evaluation report');
            }
            const body = process.env.HAS_ARTIFACT === 'true'
              ? fs.readFileSync('report/smoke.md', 'utf8')
              : `${marker}\n## Evaluation smoke: ERROR\n\nNo report was generated. See workflow logs.`;
            if (!body.startsWith(marker) || Buffer.byteLength(body, 'utf8') > 60000) {
              throw new Error('Invalid or oversized evaluation report');
            }
            const content = `${body}\nWorkflow conclusion: **${run.conclusion}**. [Run details](${run.html_url})`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number
            });
            const previous = comments.find(c =>
              c.user?.login === 'github-actions[bot]' && c.body?.startsWith(marker)
            );
            if (previous) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: previous.id, body: content
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body: content
              });
            }
