name: Bicep validation

on:
  pull_request:
    paths:
      - "infrastructure/**"
      - ".github/workflows/bicep-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bicep:
    name: Bicep lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Bicep
        run: az bicep install

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Lint and build all Bicep files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' bicep_files < <(find infrastructure -type f -name '*.bicep' -print0)
          if ((${#bicep_files[@]} == 0)); then
            echo "No Bicep files found under infrastructure/." >&2
            exit 1
          fi
          for file in "${bicep_files[@]}"; do
            echo "Linting ${file}"
            az bicep lint --file "${file}"
            echo "Building ${file}"
            az bicep build --file "${file}" --stdout > /dev/null
          done

      - name: Test identity and RBAC contracts
        run: |
          python -m pip install --disable-pip-version-check pytest==8.4.2
          python -m pytest infrastructure/tests/test_identity_rbac.py -q --noconftest -p no:cacheprovider
