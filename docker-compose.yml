services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-accelerator}
      POSTGRES_USER: ${POSTGRES_USER:-accelerator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.33.0
    command: azurite --location /data --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0
    ports:
      - "${AZURITE_BLOB_PORT:-10000}:10000"
      - "${AZURITE_QUEUE_PORT:-10001}:10001"
      - "${AZURITE_TABLE_PORT:-10002}:10002"
    volumes:
      - azurite-data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const net = require('net'); const socket = net.connect(10000, '127.0.0.1'); socket.on('connect', () => { socket.end(); process.exit(0); }); socket.on('error', () => process.exit(1));"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  migrate:
    image: python:3.12-slim
    working_dir: /workspace
    volumes:
      - .:/workspace:ro
    command:
      - /bin/sh
      - -c
      - >-
        cp -a /workspace/apps/api /tmp/accelerator-api
        && cp -a /workspace/packages/agent_core /tmp/accelerator-agent-core
        && cp -a /workspace/packages/security_core /tmp/accelerator-security-core
        && python -m pip install --no-cache-dir /tmp/accelerator-agent-core /tmp/accelerator-security-core /tmp/accelerator-api
        && python -m accelerator.migrations upgrade head
    environment:
      API_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-accelerator}:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/${POSTGRES_DB:-accelerator}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: python:3.12-slim
    working_dir: /workspace
    volumes:
      - .:/workspace:ro
    command:
      - /bin/sh
      - -c
      - >-
        cp -a /workspace/apps/api /tmp/accelerator-api
        && cp -a /workspace/packages/agent_core /tmp/accelerator-agent-core
        && cp -a /workspace/packages/security_core /tmp/accelerator-security-core
        && python -m pip install --no-cache-dir /tmp/accelerator-agent-core /tmp/accelerator-security-core /tmp/accelerator-api 'uvicorn[standard]>=0.30,<1'
        && python -m uvicorn --factory accelerator.api.main:create_application --host 0.0.0.0 --port 8000
    environment:
      API_ENVIRONMENT: ${API_ENVIRONMENT:-development}
      API_ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:?Set ENTRA_TENANT_ID in .env}
      API_ENTRA_AUDIENCE: ${ENTRA_API_AUDIENCE:?Set ENTRA_API_AUDIENCE in .env}
      API_WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      # Optional Azure services; blank values are treated as unset.
      API_FOUNDRY_PROJECT_ENDPOINT: ${API_FOUNDRY_PROJECT_ENDPOINT:-}
      API_FOUNDRY_MODEL_DEPLOYMENT: ${API_FOUNDRY_MODEL_DEPLOYMENT:-}
      API_SEARCH_ENDPOINT: ${API_SEARCH_ENDPOINT:-}
      API_SEARCH_INDEX_NAME: ${API_SEARCH_INDEX_NAME:-}
      APPLICATIONINSIGHTS_CONNECTION_STRING: ${APPLICATIONINSIGHTS_CONNECTION_STRING:-}
      API_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-accelerator}:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/${POSTGRES_DB:-accelerator}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      azurite:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; socket.create_connection(('127.0.0.1', 8000), timeout=2).close()"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:?Set ENTRA_TENANT_ID in .env}
        NEXT_PUBLIC_ENTRA_CLIENT_ID: ${ENTRA_WEB_CLIENT_ID:?Set ENTRA_WEB_CLIENT_ID in .env}
        NEXT_PUBLIC_ENTRA_API_SCOPE: ${ENTRA_API_SCOPE:?Set ENTRA_API_SCOPE in .env}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const http = require('http'); const request = http.get('http://127.0.0.1:3000', response => process.exit(response.statusCode < 500 ? 0 : 1)); request.on('error', () => process.exit(1)); request.setTimeout(3000, () => { request.destroy(); process.exit(1); });"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: workers/ingestion/Dockerfile
    environment:
      INGESTION_LOG_LEVEL: ${INGESTION_LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      azurite:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  postgres-data:
  azurite-data:
