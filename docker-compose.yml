services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-accelerator}
      POSTGRES_USER: ${POSTGRES_USER:-accelerator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.33.0
    # --skipApiVersionCheck: the storage SDKs in uv.lock request a newer service API
    # version than this emulator accepts, and it would refuse every call (CI and
    # tests/e2e_local run it the same way).
    command: azurite --location /data --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --skipApiVersionCheck --loose
    ports:
      - "${AZURITE_BLOB_PORT:-10000}:10000"
      - "${AZURITE_QUEUE_PORT:-10001}:10001"
      - "${AZURITE_TABLE_PORT:-10002}:10002"
    volumes:
      - azurite-data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const net = require('net'); const socket = net.connect(10000, '127.0.0.1'); socket.on('connect', () => { socket.end(); process.exit(0); }); socket.on('error', () => process.exit(1));"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: fde-accelerator-api:local
    command: ["python", "-m", "accelerator.migrations", "upgrade", "head"]
    environment:
      API_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-accelerator}:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/${POSTGRES_DB:-accelerator}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: fde-accelerator-api:local
    environment:
      API_ENVIRONMENT: ${API_ENVIRONMENT:-development}
      API_ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:?Set ENTRA_TENANT_ID in .env}
      API_ENTRA_AUDIENCE: ${ENTRA_API_AUDIENCE:?Set ENTRA_API_AUDIENCE in .env}
      API_WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      # Optional Azure services; blank values are treated as unset.
      API_FOUNDRY_PROJECT_ENDPOINT: ${API_FOUNDRY_PROJECT_ENDPOINT:-}
      API_FOUNDRY_MODEL_DEPLOYMENT: ${API_FOUNDRY_MODEL_DEPLOYMENT:-}
      API_FOUNDRY_EMBEDDING_DEPLOYMENT: ${API_FOUNDRY_EMBEDDING_DEPLOYMENT:-}
      API_SEARCH_VECTOR_DIMENSIONS: ${API_SEARCH_VECTOR_DIMENSIONS:-}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      API_SEARCH_ENDPOINT: ${API_SEARCH_ENDPOINT:-}
      API_SEARCH_INDEX_NAME: ${API_SEARCH_INDEX_NAME:-}
      # Without it, development runs unscreened (logged); production requires it.
      API_CONTENT_SAFETY_ENDPOINT: ${API_CONTENT_SAFETY_ENDPOINT:-}
      APPLICATIONINSIGHTS_CONNECTION_STRING: ${APPLICATIONINSIGHTS_CONNECTION_STRING:-}
      API_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-accelerator}:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/${POSTGRES_DB:-accelerator}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      azurite:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).close()"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:?Set ENTRA_TENANT_ID in .env}
        NEXT_PUBLIC_ENTRA_CLIENT_ID: ${ENTRA_WEB_CLIENT_ID:?Set ENTRA_WEB_CLIENT_ID in .env}
        NEXT_PUBLIC_ENTRA_API_SCOPE: ${ENTRA_API_SCOPE:?Set ENTRA_API_SCOPE in .env}
    environment:
      # Server-side route handlers call the API over the compose network; the
      # browser only ever talks to this web origin.
      API_BASE_URL: http://api:8000
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const http = require('http'); const request = http.get('http://127.0.0.1:3000', response => process.exit(response.statusCode < 500 ? 0 : 1)); request.on('error', () => process.exit(1)); request.setTimeout(3000, () => { request.destroy(); process.exit(1); });"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: workers/ingestion/Dockerfile
    environment:
      INGESTION_ENVIRONMENT: development
      INGESTION_LOG_LEVEL: ${INGESTION_LOG_LEVEL:-INFO}
      INGESTION_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-accelerator}:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/${POSTGRES_DB:-accelerator}
      # Indexing stays disabled (the worker idles, healthy) until Azurite and the
      # Azure AI Search / Foundry embedding settings below are all provided.
      INGESTION_STORAGE_CONNECTION_STRING: ${AZURITE_CONNECTION_STRING:-}
      INGESTION_SEARCH_ENDPOINT: ${API_SEARCH_ENDPOINT:-}
      INGESTION_SEARCH_INDEX_NAME: ${API_SEARCH_INDEX_NAME:-}
      INGESTION_VECTOR_DIMENSIONS: ${API_SEARCH_VECTOR_DIMENSIONS:-}
      INGESTION_FOUNDRY_PROJECT_ENDPOINT: ${API_FOUNDRY_PROJECT_ENDPOINT:-}
      INGESTION_FOUNDRY_EMBEDDING_DEPLOYMENT: ${API_FOUNDRY_EMBEDDING_DEPLOYMENT:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      azurite:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "accelerator.ingestion.healthcheck"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  postgres-data:
  azurite-data:
