[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fde-accelerator-api"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic-settings>=2.7,<3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["accelerator*"]
